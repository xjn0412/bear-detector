name: CPU checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python tests/test_classes.py
      - run: python tests/test_sampling.py
      - run: python tests/test_yolo.py
      - run: python -m compileall -q backbone.py runtime.py compat.py tools
